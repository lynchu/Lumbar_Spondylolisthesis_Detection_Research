seed: 42

train_csv: "./dataset/train/lumbar_diagnosis.csv"
val_csv: "./dataset/valid/lumbar_diagnosis.csv"
test_csv: "./dataset/test/lumbar_diagnosis.csv"

train_image_dir: "./dataset/train/lumbar_crop"
val_image_dir: "./dataset/valid/lumbar_crop"
test_image_dir: "./dataset/test/lumbar_crop"

# train_mask_dir: "./dataset/train/lumbar_crop_mask"
# val_mask_dir: "./dataset/valid/lumbar_crop_mask"
# test_mask_dir: "./dataset/test/lumbar_crop_mask"

save_dir: "./presence/experiments/exp_resnet50_basic_mask_cv5"

batch_size: 8
num_workers: 4
epochs: 40
num_folds: 5

imagenet_pretrained: false
lumbar_pretrained_ckpt: "./data/weights/global_resnet50_20250608_0110/model_global.pth"

backbone_lr: 0.0001
head_lr: 0.0005
weight_decay: 0.0001
dropout: 0.2

exclude_s1_positive: false
threshold: 0.5
pos_weight: null

monitor_metric: "balanced_acc"
early_stop_patience: 10
early_stop_min_delta: 0.0

use_repeat_map: false
print_repeat_map_stats: true

pair_repeat_map:
  negative: 1
  missing: 1
  L5-L4: 1
  L4-L3: 2
  L3-L2: 4
  L2-L1: 4

clahe_clip_limit: 4.0
clahe_tile_grid_size: [8, 8]
augmentation:
  image_size: [512, 150]
  rotation_deg: 5.0
  brightness: 0.08
  contrast: 0.08
  use_horizontal_flip: false
  horizontal_flip_prob: 0.1